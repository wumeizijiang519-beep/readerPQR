[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "readerpqr"
version = "0.1.0"
description = "AI bilingual PDF reader for Windows 11"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-only"
dependencies = ["PySide6==6.10.2", "PyMuPDF==1.26.7", "httpx==0.28.1"]

[project.gui-scripts]
readerpqr = "readerpqr.__main__:main"

[tool.setuptools.packages.find]
include = ["readerpqr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
